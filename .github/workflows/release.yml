name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump kind
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# Never cancel a production release partway through.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bump every manifest
        run: node scripts/release.mjs ${{ inputs.bump }}
      - name: Full gate against the bumped tree
        run: npm run check
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): $VERSION" || echo "no version changes"
          git tag -f "$(node -p "require('./package.json').version")"
      - name: Push
        run: git push --follow-tags
